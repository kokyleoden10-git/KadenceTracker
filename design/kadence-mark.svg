<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="46%" r="60%">
      <stop offset="0%" stop-color="#1B2427"/>
      <stop offset="100%" stop-color="#12181A"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bgGlow)"/>

  <!-- orbit rings, astrology-chart feel -->
  <circle cx="512" cy="512" r="250" fill="none" stroke="#8FA39E" stroke-opacity="0.16" stroke-width="2"/>
  <circle cx="512" cy="512" r="340" fill="none" stroke="#8FA39E" stroke-opacity="0.22" stroke-width="2"/>
  <circle cx="512" cy="512" r="400" fill="none" stroke="#8FA39E" stroke-opacity="0.14" stroke-width="2"/>

  <!-- zodiac-wheel tick marks, 12 positions -->
  <g stroke="#7FBFB0" stroke-opacity="0.45" stroke-width="3">
    <line x1="512" y1="92"  x2="512" y2="122"/>
    <line x1="722" y1="145" x2="707" y2="171"/>
    <line x1="879" y1="302" x2="853" y2="317"/>
    <line x1="932" y1="512" x2="902" y2="512"/>
    <line x1="879" y1="722" x2="853" y2="707"/>
    <line x1="722" y1="879" x2="707" y2="853"/>
    <line x1="512" y1="932" x2="512" y2="902"/>
    <line x1="302" y1="879" x2="317" y2="853"/>
    <line x1="145" y1="722" x2="171" y2="707"/>
    <line x1="92"  y1="512" x2="122" y2="512"/>
    <line x1="145" y1="302" x2="171" y2="317"/>
    <line x1="302" y1="145" x2="317" y2="171"/>
  </g>

  <!-- 8 small K's radiating like a compass/mandala, cycling the four domain colors -->
  <g font-family="Baskerville, Didot, Georgia, serif" font-weight="700" text-anchor="middle">
    <text x="512"   y="172"   dy="0.32em" font-size="108" fill="#3E8E85">K</text>
    <text x="752.4" y="271.6" dy="0.32em" font-size="108" fill="#5FA8D3">K</text>
    <text x="852"   y="512"   dy="0.32em" font-size="108" fill="#6B5B95">K</text>
    <text x="752.4" y="752.4" dy="0.32em" font-size="108" fill="#B08355">K</text>
    <text x="512"   y="852"   dy="0.32em" font-size="108" fill="#3E8E85">K</text>
    <text x="271.6" y="752.4" dy="0.32em" font-size="108" fill="#5FA8D3">K</text>
    <text x="172"   y="512"   dy="0.32em" font-size="108" fill="#6B5B95">K</text>
    <text x="271.6" y="271.6" dy="0.32em" font-size="108" fill="#B08355">K</text>
  </g>

  <!-- central K -->
  <text x="512" y="512" dy="0.34em" font-family="Baskerville, Didot, Georgia, serif" font-weight="700"
        font-size="440" fill="#EDE7DD" text-anchor="middle" filter="url(#softGlow)">K</text>
</svg>
