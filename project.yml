name: Kadence
options:
  bundleIdPrefix: com.kyleoden
  deploymentTarget:
    iOS: "17.0"
targets:
  Kadence:
    type: application
    platform: iOS
    sources:
      - Kadence
    info:
      path: Kadence/Info.plist
      properties:
        CFBundleDisplayName: Kadence
        UILaunchScreen: {}
        UIAppFonts:
          - DMSerifDisplay-Regular.ttf
          - Inter-Regular.ttf
    entitlements:
      path: Kadence/Kadence.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kyleoden.kadence
        PRODUCT_NAME: Kadence
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: Supabase
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
